name: PHPUnit tests

on:
  push:
    branches:
      - "**"

jobs:
  run-phpunit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: |
          cd vide-grenier-en-ligne-master
          composer install --no-interaction --no-progress

      - name: Run PHPUnit tests
        run: |
          ./vide-grenier-en-ligne-master/vendor/bin/phpunit vide-grenier-en-ligne-master/tests/
          echo "Adios"

