name: PHPUnit tests

on:
  push:
    branches:
      - "**"

jobs:
  run-phpunit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PHPUnit tests
        run: |
          ./vide-grenier-en-ligne-master/vendor/bin/phpunit tests/
          echo "Adios"
