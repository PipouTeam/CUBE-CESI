name: Push on Docker Hub and deploy

on:
  push:
    branches:
      - "**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub with token
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker images
        run: |
          docker build -t nathlr/vide-grenier-php:latest -f DockerFile .
          docker build -t nathlr/vide-grenier-php:enora -f DockerFile .

      - name: Push Docker images
        run: |
          docker push nathlr/vide-grenier-php:latest
          docker push nathlr/vide-grenier-php:enora

      - name: Deploy stage and prod
        run: |
          cd vide-grenier-en-ligne-master
          ./scripts/all_run.sh
