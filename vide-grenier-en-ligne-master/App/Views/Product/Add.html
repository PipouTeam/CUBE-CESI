{% extends "base.html" %}

{% block title %}Produit{% endblock %}

{% block body %}
<div class="content-wrapper upload-page edit-page">

    <!-- channel -->
    <div class="container-fluid add-header">
        <div class="row">
            <h1>
                Que souhaitez-vous donner ?
            </h1>
        </div>
    </div>
    <!-- ///channel -->

    <div class="container mt-30">
        <form action="" method="post" enctype="multipart/form-data">
            <div class="row">
                <div class="col-lg-6">
                    <div class="u-form">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="e1">Titre</label>
                                    <input type="text" name="name" class="form-control" id="e1"
                                           placeholder="Jeu de cartes (rare)">
                                </div>
                            </div>
                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="e2">Description</label>
                                    <textarea class="form-control" name="description" id="e2" rows="3"></textarea>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="city-search">Ville</label>
                                    <input type="text" class="form-control" id="city-search" placeholder="Entrez une ville..." autocomplete="off">
                                    <input type="hidden" name="city_id" id="selected-city-id" value="">
                                </div>
                                <div id="city-suggestions" class="list-group" style="position: absolute; z-index: 1000; width: 100%; max-height: 300px; overflow-y: auto; display: none;"></div>
                            </div>

                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="e3">Image</label>
                                    <input type="file" class="form-control" name="picture" id="e3" rows="3"/>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="u-area mt-small">
                        <button type="submit" name="submit" class="btn btn-primary u-btn">Valider</button>
                    </div>
                    <div class="u-terms">
                        <p>En soumettant votre article vous acceptez les <a href="#">conditions générales</a> de Vide Grenier en
                            ligne.</p>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock body %}

{% block javascript %}
    <script type="text/javascript">
        $(document).ready(function () {
            var selectedCityId = null;
            
            // City search on enter key
            $('#city-search').on('keypress', function(e) {
                if (e.which === 13) { // Enter key
                    searchCities();
                    e.preventDefault();
                }
            });
            
            // Show suggestions as user types
            $('#city-search').on('keyup', function() {
                // Debounce the search to avoid too many requests
                clearTimeout($(this).data('timer'));
                var self = this;
                var timer = setTimeout(function() {
                    searchCities();
                }, 300); // Wait 300ms after typing stops
                $(self).data('timer', timer);
            });
            
            // Function to search cities
            function searchCities() {
                var query = $('#city-search').val();
                if (query.length >= 3) {
                    $.ajax({
                        url: "/api/cities?query=" + encodeURIComponent(query),
                        method: 'GET'
                    }).done(function(cities) {
                        var suggestions = $('#city-suggestions');
                        suggestions.empty();
                        
                        if (cities.length > 0) {
                            for (var i = 0; i < cities.length; i++) {
                                var city = cities[i];
                                var cityId = city.ville_id;
                                var cityName = city.ville_nom_reel + ' (' + city.ville_code_postal + ')';
                                
                                var item = $('<a href="#" class="list-group-item"></a>')
                                    .text(cityName)
                                    .data('city-id', cityId)
                                    .data('city-name', cityName)
                                    .click(function(e) {
                                        e.preventDefault();
                                        var selectedId = $(this).data('city-id');
                                        var selectedName = $(this).data('city-name');
                                        
                                        // Set the selected city
                                        $('#city-search').val(selectedName);
                                        selectedCityId = selectedId;
                                        $('#selected-city-id').val(selectedId);
                                        
                                        // Hide the suggestions
                                        $('#city-suggestions').hide();
                                    });
                                
                                suggestions.append(item);
                            }
                            
                            // Show the suggestions
                            suggestions.show();
                        } else {
                            suggestions.hide();
                        }
                    });
                } else {
                    $('#city-suggestions').hide();
                }
            }
            
            // Hide suggestions when clicking outside
            $(document).on('click', function(e) {
                if (!$(e.target).closest('#city-search, #city-suggestions').length) {
                    $('#city-suggestions').hide();
                }
            });
            
            // Show suggestions when focusing on the search field
            $('#city-search').on('focus', function() {
                if ($(this).val().length >= 3) {
                    $('#city-suggestions').show();
                }
            });
        });
    </script>
{% endblock %}
